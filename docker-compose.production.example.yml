# docker-compose.production.example.yml
# Template para produção — copiar para docker-compose.production.yml e preencher
# .env.production com os valores reais.
#
# Uso:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# NUNCA versionar .env.production nem este ficheiro com secrets reais.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: eternal-flowers-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-<DEFINIR>}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loja_flores}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loja} -d ${POSTGRES_DB:-loja_flores}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eternal-flowers-net
    expose:
      - "5432"
    # PostgreSQL NÃO exposto publicamente. Apenas acessível via rede interna.
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eternal-flowers-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PG_PUSH: "false"
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      INSTAGRAM_BUSINESS_ID: ${INSTAGRAM_BUSINESS_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
    expose:
      - "3000"
    # A app NÃO tem porta pública. O reverse proxy faz o front-end.
    ports: []
    volumes:
      - media_data:/app/media
    networks:
      - eternal-flowers-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: eternal-flowers-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./configs/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - eternal-flowers-net
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    name: eternal-flowers-postgres-data
    # Backup crítico — este volume contém toda a base de dados.
  media_data:
    name: eternal-flowers-media-data
    # Ficheiros de upload (imagens dos produtos).
  caddy_data:
    name: eternal-flowers-caddy-data
    # Certificados TLS geridos pelo Caddy (Let's Encrypt).
  caddy_config:
    name: eternal-flowers-caddy-config

networks:
  eternal-flowers-net:
    name: eternal-flowers-net
    driver: bridge