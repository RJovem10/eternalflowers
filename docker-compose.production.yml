# =============================================================================
# docker-compose.production.yml
# Configuração de deployment production versionada.
# NÃO contém secrets — todas as variáveis vêm de .env.production em runtime.
#
# Uso (PREFERIDO — garante --env-file):
#   ./scripts/production/compose.sh up -d
#
# Equivalente manual:
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# ⚠️  NUNCA omitir --env-file .env.production.
#     Sem ele, variáveis como DATABASE_URI e PAYLOAD_SECRET resolvem
#     como string vazia, quebrando o arranque do container.
#
# .env.production está em .gitignore — NUNCA versionar com secrets reais.
#
# Arquitetura de rede:
#   Internet → Caddy (:80/:443) → App (:3000) → PostgreSQL (:5432)
#   └─ maintenance-scheduler (HTTP interno, sem porta pública)
#   Apenas Caddy expõe portas ao host. App, Postgres e Scheduler
#   são rede interna.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: eternal-flowers-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loja_flores}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loja} -d ${POSTGRES_DB:-loja_flores}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eternal-flowers-net
    expose:
      - "5432"
    # PostgreSQL NÃO exposto publicamente. Apenas acessível via rede interna.
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* são necessárias durante o build do Next.js
        # (incorporadas no bundle). Apenas variáveis públicas — NUNCA secrets.
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    container_name: eternal-flowers-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PG_PUSH: "false"
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET}
      INSTAGRAM_BUSINESS_ID: ${INSTAGRAM_BUSINESS_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
    expose:
      - "3000"
    # A app NÃO tem porta pública. O reverse proxy (futuro) faz o front-end.
    ports: []
    volumes:
      - media_data:/app/media
    networks:
      - eternal-flowers-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # ─── Maintenance Scheduler ─────────────────────────────────────
  # Serviço autónomo que invoca POST /api/internal/maintenance a cada 5 minutos.
  # NÃO tem acesso a PostgreSQL, Payload, Stripe ou internet.
  # NÃO expõe portas. Usa rede interna apenas.
  # Única dependência: MAINTENANCE_SECRET vindo de .env.production.
  # A imagem é mínima (Alpine + curl).
  maintenance-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.maintenance-scheduler
    container_name: eternal-flowers-maintenance-scheduler
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    env_file:
      - .env.production
    # Apenas MAINTENANCE_SECRET é necessária. As restantes variáveis
    # do .env.production são ignoradas pelo scheduler.
    # NÃO recebe: DATABASE_URI, PAYLOAD_SECRET, STRIPE_SECRET_KEY,
    # RESEND_API_KEY, ou qualquer outro secret de produção.
    networks:
      - eternal-flowers-net
    # Sem expose. Sem ports. Sem volumes.
    deploy:
      resources:
        limits:
          memory: 32M
        reservations:
          memory: 16M

  caddy:
    image: caddy:2-alpine
    container_name: eternal-flowers-caddy
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    networks:
      - eternal-flowers-net
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    name: eternal-flowers-postgres-data
    # Backup crítico — este volume contém toda a base de dados.
  media_data:
    name: eternal-flowers-media-data
    # Ficheiros de upload (imagens dos produtos).
  caddy_data:
    name: eternal-flowers-caddy-data
    # Certificados TLS (Let's Encrypt). Persistente — sem isto, Caddy re-emite
    # certificados a cada arranque, atingindo rápidos limites de rate da ACME.
  caddy_config:
    name: eternal-flowers-caddy-config
    # Configuração interna do Caddy (OCSP stapling, etc.).

networks:
  eternal-flowers-net:
    name: eternal-flowers-net
    driver: bridge