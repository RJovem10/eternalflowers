# =============================================================================
# docker-compose.production.yml
# Configuração de deployment production versionada.
# NÃO contém secrets — todas as variáveis vêm de .env.production em runtime.
#
# Uso:
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# .env.production está em .gitignore — NUNCA versionar com secrets reais.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: eternal-flowers-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loja}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-loja_flores}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loja} -d ${POSTGRES_DB:-loja_flores}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - eternal-flowers-net
    expose:
      - "5432"
    # PostgreSQL NÃO exposto publicamente. Apenas acessível via rede interna.
    ports: []
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eternal-flowers-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URI: ${DATABASE_URI}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PG_PUSH: "false"
      NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      MAINTENANCE_SECRET: ${MAINTENANCE_SECRET}
      INSTAGRAM_BUSINESS_ID: ${INSTAGRAM_BUSINESS_ID:-}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
    expose:
      - "3000"
    # A app NÃO tem porta pública. O reverse proxy (futuro) faz o front-end.
    ports: []
    volumes:
      - media_data:/app/media
    networks:
      - eternal-flowers-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

volumes:
  postgres_data:
    name: eternal-flowers-postgres-data
    # Backup crítico — este volume contém toda a base de dados.
  media_data:
    name: eternal-flowers-media-data
    # Ficheiros de upload (imagens dos produtos).

networks:
  eternal-flowers-net:
    name: eternal-flowers-net
    driver: bridge